.py:
  # ORM method updates for Odoo 15.0 to 16.0 migration
  
  # External ID methods
  \.get_xml_id\(: ".get_external_id("
  \.get_xml_id_from_record\(: ".get_external_id("
  
  # Fields introspection 
  \.fields_get_keys\(\): "._fields"
  \.fields_get\(\): "._fields_get()"
  \.get_fields_list\(\): "list(self._fields.keys())"
  
  # Database methods
  \._table_has_column\(: "._table_has_column("
  
  # Search and filtering
  \.search_count\(([^)]*)\)\.ids: ".search_count(\\1)"
  \.browse\(([^)]*)\)\.ids: "\\1 if isinstance(\\1, list) else [\\1]"
  
  # Record operations
  \.write\(({[^}]+})\): ".write(\\1)"
  \.sudo\(\)\.write\(: ".sudo().write("
  \.with_context\([^)]*\)\.write\(: ".write("
  
  # Date/DateTime handling
  'fields\.Date\.from_string\(([^)]+)\)': 'fields.Date.from_string(\\1) if isinstance(\\1, str) else \\1'
  'fields\.Datetime\.from_string\(([^)]+)\)': 'fields.Datetime.from_string(\\1) if isinstance(\\1, str) else \\1'
  'fields\.Date\.to_string\(([^)]+)\)': 'fields.Date.to_string(\\1) if \\1 else False'
  'fields\.Datetime\.to_string\(([^)]+)\)': 'fields.Datetime.to_string(\\1) if \\1 else False'
  
  # Company/Multi-company
  \.company_id\.id: ".company_id.id if self.company_id else False"
  'self\.env\.user\.company_id\.id': 'self.env.company.id'
  'self\.env\.context\.get\(["\']company_id["\']\)': 'self.env.company.id'
  
  # Environment updates
  'self\.pool': 'self.env.registry'
  'self\.pool\.get\(([^)]+)\)': 'self.env[\\1]'
  
  # Currency methods
  \.currency_id\.compute\(: ".currency_id._convert("
  \.currency_id\.round\(: ".currency_id.round("
  
  # Attachment handling
  'ir\.attachment': 'ir.attachment'
  \.attachment_ids\.filtered\(lambda\s+att:\s*att\.mimetype: ".attachment_ids.filtered(lambda att: att.mimetype"
  
  # Translation methods
  '_\(([^)]+)\)': '_t(\\1)'
  'self\.env\._\(': 'self.env._t('
  
  # Security and access rights
  \.check_access_rights\(([^)]+),\s*raise_exception=False\): ".check_access_rights(\\1)"
  \.has_group\(([^)]+)\): ".user_has_groups(\\1)"
  
  # Sequence methods
  'ir\.sequence': 'ir.sequence'
  \.next_by_id\(([^)]+)\): ".next_by_id(\\1)"
  
  # Mail/Chatter related
  'mail\.thread': 'mail.thread'
  \.message_post\(([^)]*)\): ".message_post(\\1)"
  
  # Report methods  
  \.render_template\(([^)]+)\): "._render_template(\\1)"
  
  # XML/View methods
  \.get_formview_id\(\): ".get_formview_id()"
  \.get_formview_action\(\): ".get_formview_action()"
  
  # Deprecated methods
  \.resolve_2many_commands\(: "._resolve_2many_commands("
  \.is_transient\(\): ".is_transient()"
  \.default_get\(([^)]+)\)\.get\(: ".default_get(\\1).get("
  
  # Workflow methods (removed in newer versions)
  \.signal_workflow\(: "# .signal_workflow( - Deprecated, use record states instead"
  'import.*workflow': "# import workflow - Deprecated, use record states instead"
  
  # Registry methods
  'openerp\.addons': 'odoo.addons'
  'import.*openerp': 'import odoo'
  'from.*openerp': 'from odoo'
  
  # Tools imports
  'from.*openerp\.tools': 'from odoo.tools'
  'from.*openerp\.osv': 'from odoo.osv'
  
  # Model inheritance fixes
  '_inherits\s*=\s*{': '_inherits = {'
  '_inherit\s*=\s*\[': '_inherit = ['
