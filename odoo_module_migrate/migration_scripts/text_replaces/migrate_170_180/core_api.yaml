.py:
  # odoo 18.0 odoo/fields.py : "Since Odoo 18, 'group_operator' is deprecated, use
  # 'aggregator' instead" ; Odoo fait lui-même attrs['aggregator'] = attrs.pop('group_operator')
  '\bgroup_operator(\s*=)': 'aggregator\1'
  # BaseModel.user_has_groups (17.0 odoo/models.py) supprimé en 18.0 ; res.users.has_groups
