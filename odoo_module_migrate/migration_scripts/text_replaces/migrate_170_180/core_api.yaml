  # (groupes « ! » exclus d'abord, un groupe positif suffit, base.group_no_one en debug seulement).
  # self.user_has_groups(...) est traité par replace_user_has_groups (migrate_170_180.py) ;
  # ici les autres receveurs (rec., self.sudo()., self.env['x']....)
  '(?<!\bself)\.user_has_groups\(': '.env.user.has_groups('
