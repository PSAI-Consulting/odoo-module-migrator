# Account invoice migration - Odoo 13.0
# account.invoice model was merged with account.move

.py:
  # Replace model references
  '[''"]account\.invoice[''"]': "'account.move'"
  '[''"]account\.invoice\.line[''"]': "'account.move.line'"

  # Replace field names that changed
  '\.number': ".name"
  '\.type': ".move_type"

  # Replace state values
  'state.*=.*[''"]open[''"]': "state = 'posted'"
  '[''"]open[''"]': "'posted'"

  # Replace residual checks with payment_state
  '\(''residual'',\s*''>'',\s*0\)': "('payment_state', '!=', 'paid')"

  # Replace method names that changed
  '\.action_invoice_open\(': ".action_post("
  '\.action_invoice_cancel\(': ".button_cancel("
  '\.action_invoice_draft\(': ".button_draft("

.xml:
  # Replace model in XML views
  'model="account\.invoice"': 'model="account.move"'
  'model=''account\.invoice''': "model='account.move'"

  # Replace view references
  'account\.invoice_form': "account.view_move_form"
  'account\.invoice_tree': "account.view_move_tree"
  'account\.view_account_invoice_filter': "account.view_account_move_filter"

  # Replace field names in XML
  'name="type"': 'name="move_type"'

  # Replace button names
  'name="action_invoice_open"': 'name="action_post"'
  'name="action_invoice_cancel"': 'name="button_cancel"'
  'name="action_invoice_draft"': 'name="button_draft"'