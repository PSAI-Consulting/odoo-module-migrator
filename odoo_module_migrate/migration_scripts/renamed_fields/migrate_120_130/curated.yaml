# Renommages 12.0 -> 13.0 vérifiés à la main : prioritaires sur generated.yaml (OpenUpgrade).
#
# account.invoice fusionné dans account.move (OpenUpgrade 13.0 addons/account/migrations/
# 13.0.1.1/post-migration.py : UPDATE account_move ... = (ai....), merge_models). Seules les
# correspondances une à une, sans dépendance au type de facture, sont reprises ; name,
# reference, comment (dépendants du type) et state (valeurs différentes) ne le sont pas.
# Les règles écrites sur account.invoice / account.invoice.line s'appliquent aussi au code
# déjà renommé en account.move / account.move.line (base_migration_script.handle_fields).
# odoo ab483a3a6610 "[IMP] account: Add restrict mode and normal mode for account move. This commit deletes account_cancel module and squash it into account. The 'update_posted' field is changed by 'restrict_mode_hash_table' field." : même numéro de séquence inaltérable, déplacé de l10n_fr vers account
- schema_version: 2
  kind: renamed_field
  model: "account.move"
  old_field: "l10n_fr_secure_sequence_number"
  new_field: "secure_sequence_number"
  confidence: verified
  evidence:
    - repository: "odoo"
      commit: "ab483a3a6610"
      title: "[IMP] account: Add restrict mode and normal mode for account move. This commit deletes account_cancel module and squash it into account. The 'update_posted' field is changed by 'restrict_mode_hash_table' field."
    - repository: "openupgrade"
      file: "addons/account/migrations/"
      note: "OpenUpgrade 13.0"
  message: "odoo ab483a3a6610 \"[IMP] account: Add restrict mode and normal mode for account move. This commit deletes account_cancel module and squash it into account. The 'update_posted' field is changed by 'restrict_mode_hash_table' field.\""
