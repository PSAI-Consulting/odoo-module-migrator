# Changements 19.0 -> 20.0 à traiter à la main, vérifiés dans les sources 20.0.
# (Version précédente écrite de mémoire : « request indisponible dans les
# modèles » était faux, 67 models/*.py d'Odoo 20 l'importent ; mail.tracking.value
# n'est pas supprimé mais déplacé.)
.py:
  # odoo 7809101d2dec "[IMP] orm: remove Model._table_query"
  '\b_table_query\b': "[20] Model._table_query was removed (odoo 7809101d2dec): turn the report model into _auto = False + init() creating a SQL view"
  # odoo dd0c51ec1855 "[ADD] mail, mail_tracking: move mail tracking value model to a separate module"
  '[''"]mail\.tracking\.value[''"]': "[20] mail.tracking.value moved to the new module mail_tracking (odoo dd0c51ec1855): add it to the depends"
  # odoo 20.0 odoo/orm/models.py: read_group(domain, groupby, aggregates, having, offset, limit, order) -> list[tuple]
  '\.read_group\(': "[20] read_group() now has the signature of _read_group() and returns tuples: use _read_group(), or formatted_read_group() (web) for the former dict result"
  # 20.0: ir.model.access and ir.rule replaced by ir.access (odoo/addons/base/models)
  '[''"]ir\.model\.access[''"]': "[20] ir.model.access was replaced by ir.access"
  '[''"]ir\.rule[''"]': "[20] ir.rule was replaced by ir.access"
.xml:
  'model=["'']ir\.(?:model\.access|rule)["'']': "[20] ir.model.access / ir.rule records must be converted to ir.access (done by upgrade_code 19.4-00-ir-access with --odoo-root)"
  '["'']mail\.tracking\.value["'']': "[20] mail.tracking.value moved to the new module mail_tracking (odoo dd0c51ec1855): add it to the depends"
