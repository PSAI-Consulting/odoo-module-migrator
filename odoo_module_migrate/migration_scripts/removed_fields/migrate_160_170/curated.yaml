  evidence:
    - repository: "odoo"
      commit: "68fbdc964038"
      title: "[REF] *expense*: Technical hr_expense refactor"
  message: "renamed total_amount (company currency); the 16.0 total_amount (expense currency) is now total_amount_currency - odoo 68fbdc964038 '[REF] *expense*: Technical hr_expense refactor'"
